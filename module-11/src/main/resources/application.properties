spring.application.name=accounts-service
# RFC 9457 problem details for errors such as 404 (application/problem+json)
spring.mvc.problemdetails.enabled=true
# The public key that verifies access tokens, and the audience they must be issued for.
# In production the key would come from the authorization server's JWKS (issuer-uri or jwk-set-uri).
accounts.jwt.public-key-location=classpath:jwt/trusted-public-key.pem
accounts.jwt.audience=accounts-api
